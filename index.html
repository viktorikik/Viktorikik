                { date: "17.03.2024", mom: "Лилия", momGen: "Лилии", baby: "Артемий", babyGen: "Артемия", gender: "male" },

                { date: "28.03.2024", mom: "Катя", momGen: "Кати", baby: "Дима", babyGen: "Димы", gender: "male" },
                { date: "12.04.2024", mom: "Наиля", momGen: "Наили", baby: "Андрей", babyGen: "Андрея", gender: "male" },
                { date: "23.04.2024", mom: "Маша", momGen: "Маши", baby: "Коля", babyGen: "Коли", gender: "male" },
                { date: "11.05.2024", mom: "Даша", momGen: "Даши", baby: "Лиза Аня", babyGen: "Лизы Ани", gender: "female" },
                { date: "16.05.2024", mom: "Катя", momGen: "Кати", baby: "Аня", babyGen: "Ани", gender: "female" },
                { date: "26.06.2024", mom: "Лена", momGen: "Лены", baby: "Назар", babyGen: "Назара", gender: "male" },
                { date: "14.08.2024", mom: "Катя", momGen: "Кати", baby: "Ева", babyGen: "Евы", gender: "female" },
                { date: "28.10.2025", mom: "Кристина", momGen: "Кристины", baby: "Кирилл", babyGen: "Кирилла", gender: "male" }
            ];

            const monthNames = ["Января","Февраля","Марта","Апреля","Мая","Июня","Июля","Августа","Сентября","Октября","Ноября","Декабря"];
            const monthNamesNom = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
            let currentMonth = new Date().getMonth();
            let currentYear = new Date().getFullYear();

            // ===== DOM ЭЛЕМЕНТЫ =====
            const grid = document.getElementById('calendarGrid');
            const monthLabel = document.getElementById('currentMonthLabel');
            const countEl = document.getElementById('birthdayCount');
            const birthdayWordEl = document.getElementById('birthdayWord');
            const yearSelect = document.getElementById('yearSelect');
            const filterBtns = document.querySelectorAll('.filter-btn');
            const modalOverlay = document.getElementById('modalOverlay');
            const modalDate = document.getElementById('modalDate');
            const modalNames = document.getElementById('modalNames');
            const closeBtn = document.getElementById('closeModalBtn');
            const statsEl = document.getElementById('stats');
            const todayBtn = document.getElementById('todayBtn');
            const todayInfoEl = document.getElementById('todayInfo');
            const themeNotification = document.getElementById('themeNotification');
            const themeToggleBtn = document.getElementById('themeToggleBtn');
            const themeDefaultBtn = document.getElementById('themeDefaultBtn');
            const themeMessage = document.getElementById('themeMessage');

            let currentFilter = 'all';

            // ===== ФУНКЦИЯ ОБНОВЛЕНИЯ УВЕДОМЛЕНИЯ =====
            function updateThemeUI() {
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                const savedTheme = localStorage.getItem('calendarTheme');
                const isLight = document.body.classList.contains('light-theme');
                
                let isDefault = false;
                if (!savedTheme) {
                    isDefault = true;
                } else if ((savedTheme === 'light' && !prefersDark) || (savedTheme === 'dark' && prefersDark)) {
                    isDefault = true;
                }
                
                let message = '';
                let toggleText = '';
                
                if (isLight) {
                    // Сейчас светлая тема
                    message = '☀️ Тема соответствует настройкам телефона (светлая)';
                    toggleText = '🌙 Включить тёмную';
                } else {
                    // Сейчас тёмная тема
                    message = '🌙 Тема соответствует настройкам телефона (тёмная)';
                    toggleText = '☀️ Включить светлую';
                }
                
                if (!isDefault) {
                    if (isLight) {
                        message = '☀️ Вы включили светлую тему вручную';
                    } else {
                        message = '🌙 Вы включили тёмную тему вручную';
                    }
                }
                
                themeMessage.textContent = message;
                themeToggleBtn.textContent = toggleText;
            }

            // ===== ПРИМЕНЕНИЕ ТЕМЫ =====
            function applyTheme(theme) {
                if (theme === 'light') {
                    document.body.classList.add('light-theme');
                } else if (theme === 'dark') {
                    document.body.classList.remove('light-theme');
                } else {
                    // 'default' — по настройкам телефона
                    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                    if (prefersDark) {
                        document.body.classList.remove('light-theme');
                    } else {
                        document.body.classList.add('light-theme');
                    }
                }
                updateThemeUI();
            }

            // ===== ПЕРЕКЛЮЧЕНИЕ ТЕМЫ (КНОПКА) =====
            function toggleTheme() {
                const isLight = document.body.classList.contains('light-theme');
                if (isLight) {
                    // Сейчас светлая → включаем тёмную
                    localStorage.setItem('calendarTheme', 'dark');
                    applyTheme('dark');
                } else {
                    // Сейчас тёмная → включаем светлую
                    localStorage.setItem('calendarTheme', 'light');
                    applyTheme('light');
                }
            }

            // ===== ВОЗВРАТ К СИСТЕМНОЙ ТЕМЕ =====
            function setDefaultTheme() {
                localStorage.removeItem('calendarTheme');
                applyTheme('default');
            }

            // ===== СЛУШАЕМ ИЗМЕНЕНИЕ СИСТЕМНОЙ ТЕМЫ =====
            const darkModeMediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
            darkModeMediaQuery.addEventListener('change', () => {
                // Если нет сохранённой темы — меняем автоматически
                if (!localStorage.getItem('calendarTheme')) {
                    applyTheme('default');
                }
            });

            // ===== ИНИЦИАЛИЗАЦИЯ =====
            function initTheme() {
                const savedTheme = localStorage.getItem('calendarTheme');
                if (savedTheme === 'light' || savedTheme === 'dark') {
                    applyTheme(savedTheme);
                } else {
                    applyTheme('default');
                }
            }

            // ===== ЗАПОЛНЯЕМ ВЫБОР ГОДА =====
            function populateYearSelect() {
                const currentYear = new Date().getFullYear();
                yearSelect.innerHTML = '';
                for (let y = currentYear - 5; y <= currentYear + 5; y++) {
                    const option = document.createElement('option');
                    option.value = y;
                    option.textContent = y;
                    yearSelect.appendChild(option);
                }
                yearSelect.value = currentYear;
            }
            populateYearSelect();

            // ===== КАРТЫ ДАННЫХ =====
            const kidsMap = {};
            kidsData.forEach(item => {
                const [day, month, year] = item.date.split('.').map(Number);
                const key = `${String(day).padStart(2,'0')}.${String(month).padStart(2,'0')}`;
                if (!kidsMap[key]) kidsMap[key] = [];
                kidsMap[key].push({ ...item, birthYear: year, day, month });
            });

            const momsMap = {};
            momsData.forEach(item => {
                const key = `${String(item.day).padStart(2,'0')}.${String(item.month).padStart(2,'0')}`;
                if (!momsMap[key]) momsMap[key] = [];
                momsMap[key].push({ name: item.name, nameGen: item.nameGen });
            });

            // ===== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ =====
            function getAge(birthYear, birthMonth, birthDay, targetYear, targetMonth, targetDay) {
                let age = targetYear - birthYear;
                if (targetMonth < birthMonth || (targetMonth === birthMonth && targetDay < birthDay)) age--;
                return age;
            }

            function getAgeWord(age) {
                const last = age % 10;
                const lastTwo = age % 100;
                if (lastTwo >= 11 && lastTwo <= 19) return 'лет';
                if (last === 1) return 'год';
                if (last >= 2 && last <= 4) return 'года';
                return 'лет';
            }

            function getGenderEmoji(gender) {
                return gender === 'female' ? '👧' : '👦';
            }

            // ===== ПОЛУЧЕНИЕ ИМЕННИНКОВ =====
            function getBirthdayPeople(day, month, year) {
                const key = `${String(day).padStart(2,'0')}.${String(month).padStart(2,'0')}`;
                const result = [];

                if (momsMap[key]) {
                    momsMap[key].forEach(m => {
                        result.push({
                            type: 'mom',
                            name: m.name,
                            nameGen: m.nameGen,
                            age: null,
                            gender: null
                        });
                    });
                }

                if (kidsMap[key]) {
                    kidsMap[key].forEach(k => {
                        if (year >= k.birthYear) {
                            const age = getAge(k.birthYear, month, day, year, month, day);
                            result.push({
                                type: 'kid',
                                mom: k.mom,
                                momGen: k.momGen,
                                baby: k.baby,
                                babyGen: k.babyGen,
                                age: age,
                                gender: k.gender || 'male'
                            });
                        }
                    });
                }

                return result;
            }

            function getBirthdayPeopleInMonth(month, year, filter) {
                const result = [];

                Object.keys(momsMap).forEach(key => {
                    const [d, m] = key.split('.').map(Number);
                    if (m === month + 1) {
                        momsMap[key].forEach(mom => {
                            if (filter === 'all' || filter === 'moms') {
                                result.push({
                                    type: 'mom',
                                    day: d,
                                    name: mom.name,
                                    nameGen: mom.nameGen
                                });
                            }
                        });
                    }
                });

                Object.keys(kidsMap).forEach(key => {
                    const [d, m] = key.split('.').map(Number);
                    if (m === month + 1) {
                        kidsMap[key].forEach(kid => {
                            if (year >= kid.birthYear) {
                                if (filter === 'all' || filter === 'kids') {
                                    const age = getAge(kid.birthYear, m, d, year, m, d);
                                    result.push({
                                        type: 'kid',
                                        day: d,
                                        mom: kid.mom,
                                        momGen: kid.momGen,
                                        baby: kid.baby,
                                        babyGen: kid.babyGen,
                                        age: age,
                                        gender: kid.gender || 'male'
                                    });
                                }
                            }
                        });
                    }
                });

                return result.sort((a, b) => a.day - b.day);
            }

            function countBirthdayPeopleInMonth(month, year, filter) {
                return getBirthdayPeopleInMonth(month, year, filter).length;
            }

            // ===== СТАТИСТИКА ЗА ГОД =====
            function calculateYearStats(year) {
                let allBirthdays = [];
                
                Object.keys(momsMap).forEach(key => {
                    const [day, month] = key.split('.').map(Number);
                    allBirthdays.push({
                        day: day,
                        month: month,
                        type: 'mom',
                        name: momsMap[key][0].name
                    });
                });
                
                Object.keys(kidsMap).forEach(key => {
                    const [day, month] = key.split('.').map(Number);
                    kidsMap[key].forEach(kid => {
                        if (year >= kid.birthYear) {
                            allBirthdays.push({
                                day: day,
                                month: month,
                                type: 'kid',
                                name: kid.baby,
                                gender: kid.gender || 'male'
                            });
                        }
                    });
                });

                const monthStats = {};
                allBirthdays.forEach(b => {
                    if (!monthStats[b.month]) monthStats[b.month] = 0;
                    monthStats[b.month]++;
                });

                let maxCount = 0;
                let popularMonth = 0;
                Object.keys(monthStats).forEach(month => {
                    if (monthStats[month] > maxCount) {
                        maxCount = monthStats[month];
                        popularMonth = parseInt(month);
                    }
                });

                return {
                    total: allBirthdays.length,
                    popularMonth: popularMonth,
                    popularMonthCount: maxCount
                };
            }

            // ===== СЕГОДНЯШНИЕ ИМЕНИННИКИ =====
            function getTodayBirthdays() {
                const today = new Date();
                const day = today.getDate();
                const month = today.getMonth() + 1;
                const year = today.getFullYear();
                
                const people = getBirthdayPeople(day, month, year);
                
                let filtered = people;
                if (currentFilter === 'moms') {
                    filtered = people.filter(p => p.type === 'mom');
                } else if (currentFilter === 'kids') {
                    filtered = people.filter(p => p.type === 'kid');
                }
                
                return filtered;
            }

            // ===== ОБНОВЛЕНИЕ ИНФОРМАЦИИ О СЕГОДНЯШНИХ ИМЕНИННИКАХ =====
            function updateTodayInfo() {
                const todayBirthdays = getTodayBirthdays();
                
                if (todayBirthdays.length === 0) {
                    todayInfoEl.innerHTML = `<span class="empty">😴 Сегодня именинников нет</span>`;
                    return;
                }

                const names = todayBirthdays.map(p => {
                    if (p.type === 'mom') return p.name;
                    else return p.baby;
                });

                let text = '';
                if (todayBirthdays.length === 1) {
                    const person = todayBirthdays[0];
                    if (person.type === 'mom') {
                        text = `🎉 Сегодня день рождения у <span class="highlight">${person.name}</span>!`;
                    } else {
                        const emoji = getGenderEmoji(person.gender);
                        text = `🎉 Сегодня день рождения у ${emoji} <span class="highlight">${person.baby}</span>!`;
                    }
                } else {
                    const namesList = names.join(', ');
                    text = `🎉 Сегодня день рождения у ${todayBirthdays.length} человек: <span class="highlight">${namesList}</span>`;
                }
                
                todayInfoEl.innerHTML = text;
            }

            // ===== ОБНОВЛЕНИЕ СТАТИСТИКИ =====
            function updateStats() {
                const stats = calculateYearStats(currentYear);
                if (stats.total === 0) {
                    statsEl.textContent = '📊 В этом году пока нет именинников';
                    return;
                }

                const monthName = monthNamesNom[stats.popularMonth - 1];
                statsEl.innerHTML = `
                    📊 В ${currentYear} году <strong>${stats.total}</strong> ${getBirthdayWord(stats.total)} 
                    · Самый популярный месяц — <strong>${monthName}</strong> (${stats.popularMonthCount} ${getBirthdayWord(stats.popularMonthCount)})
                `;
            }

            // ===== АНИМИРОВАННАЯ ПОДСВЕТКА СЕГОДНЯШНЕГО ДНЯ =====
            function highlightToday() {
                const today = new Date();
                const todayDate = today.getDate();
                const todayMonth = today.getMonth();
                const todayYear = today.getFullYear();
                
                if (currentMonth === todayMonth && currentYear === todayYear) {
                    const days = document.querySelectorAll('.day:not(.empty)');
                    days.forEach(day => {
                        const dayNumber = parseInt(day.textContent);
                        if (dayNumber === todayDate) {
                            day.classList.remove('today-highlight');
                            void day.offsetWidth;
                            day.classList.add('today-highlight');
                            
                            setTimeout(() => {
                                day.classList.remove('today-highlight');
                            }, 2000);
                        }
                    });
                }
            }

            // ===== РЕНДЕР =====
            function render() {
                const first = new Date(currentYear, currentMonth, 1);
                const last = new Date(currentYear, currentMonth + 1, 0);
                const daysInMonth = last.getDate();
                let start = first.getDay();
                start = start === 0 ? 6 : start - 1;

                const count = countBirthdayPeopleInMonth(currentMonth, currentYear, currentFilter);

                monthLabel.textContent = monthNamesNom[currentMonth];
                yearSelect.value = currentYear;
                countEl.textContent = count;
                birthdayWordEl.textContent = getBirthdayWord(count);

                grid.innerHTML = '';

                for (let i = 0; i < start; i++) {
                    const d = document.createElement('div');
                    d.className = 'day empty';
                    d.setAttribute('role', 'gridcell');
                    grid.appendChild(d);
                }

                const today = new Date();
                const todayDate = today.getDate();
                const todayMonth = today.getMonth();
                const todayYear = today.getFullYear();

                for (let day = 1; day <= daysInMonth; day++) {
                    const el = document.createElement('div');
                    el.className = 'day';
                    el.textContent = day;
                    el.setAttribute('role', 'gridcell');

                    const peopleOnDay = getBirthdayPeople(day, currentMonth + 1, currentYear);
                    let hasMatching = false;

                    if (currentFilter === 'all') {
                        hasMatching = peopleOnDay.length > 0;
                    } else if (currentFilter === 'moms') {
                        hasMatching = peopleOnDay.some(p => p.type === 'mom');
                    } else if (currentFilter === 'kids') {
                        hasMatching = peopleOnDay.some(p => p.type === 'kid');
                    }

                    if (hasMatching) {
                        el.classList.add('birthday');
                        el.addEventListener('click', function(e) {
                            e.stopPropagation();
                            const people = getBirthdayPeople(day, currentMonth + 1, currentYear);
                            if (people.length) {
                                openModal(day, people);
                                launchConfetti();
                            }
                        });
                        setTimeout(() => {
                            el.classList.add('pulse');
                        }, 50);
                    }

                    if (day === todayDate && currentMonth === todayMonth && currentYear === todayYear) {
                        el.classList.add('today');
                    }

                    grid.appendChild(el);
                }

                updateTodayInfo();
                updateStats();
                
                setTimeout(() => {
                    highlightToday();
                }, 100);
            }

            // ===== МОДАЛКА =====
            function openModal(day, people) {
                modalDate.innerHTML = `${day} <span class="month-name">${monthNames[currentMonth]}</span>`;

                let html = '';
                people.forEach((person, idx) => {
                    if (idx > 0) html += `<div class="divider">✦</div>`;

                    if (person.type === 'mom') {
                        html += `
                            <div class="birthday-entry">
                                <div class="greeting">🎉 Сегодня день рождения <span class="name">${person.nameGen}</span>!</div>
                            </div>
                        `;
                    } else if (person.type === 'kid') {
                        const genderWord = person.gender === 'female' ? 'малышке' : 'малышу';
                        const ageText = person.age >= 0 ? `${person.age} ${getAgeWord(person.age)}` : '';
                        const genderEmoji = getGenderEmoji(person.gender);
                        html += `
                            <div class="birthday-entry">
                                <div class="greeting">${genderEmoji} Сегодня день рождения <span class="name">${person.babyGen}</span>!</div>
                                <div class="mom-info">👩 Мама: <strong>${person.mom}</strong></div>
                                <div class="age-info">🎂 ${genderWord} исполняется ${ageText}</div>
                            </div>
                        `;
                    }
                });
                modalNames.innerHTML = html;
                modalOverlay.classList.add('active');
                document.body.style.overflow = 'hidden';
                launchConfetti();
            }

            function closeModalFn() {
                modalOverlay.classList.remove('active');
                document.body.style.overflow = '';
            }

            // ===== ОБРАБОТЧИКИ =====
            document.getElementById('prevMonth').addEventListener('click', () => {
                currentMonth--;
                if (currentMonth < 0) { currentMonth = 11; currentYear--; }
                render();
            });

            document.getElementById('nextMonth').addEventListener('click', () => {
                currentMonth++;
                if (currentMonth > 11) { currentMonth = 0; currentYear++; }
                render();
            });

            yearSelect.addEventListener('change', function() {
                currentYear = parseInt(this.value);
                render();
            });

            todayBtn.addEventListener('click', function() {
                const today = new Date();
                currentMonth = today.getMonth();
                currentYear = today.getFullYear();
                render();
                this.style.transform = 'scale(0.92)';
                setTimeout(() => {
                    this.style.transform = 'scale(1)';
                }, 200);
                
                setTimeout(() => {
                    highlightToday();
                }, 300);
            });

            themeToggleBtn.addEventListener('click', toggleTheme);
            themeDefaultBtn.addEventListener('click', setDefaultTheme);

            filterBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.dataset.filter;
                    render();
                });
            });

            closeBtn.addEventListener('click', closeModalFn);
            modalOverlay.addEventListener('click', e => {
                if (e.target === modalOverlay) closeModalFn();
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closeModalFn();
            });

            // ===== СВАЙПЫ =====
            let touchStartX = 0;
            let touchStartY = 0;
            const app = document.querySelector('.calendar-app');

            app.addEventListener('touchstart', function(e) {
                touchStartX = e.changedTouches[0].screenX;
                touchStartY = e.changedTouches[0].screenY;
            }, { passive: true });

            app.addEventListener('touchend', function(e) {
                const touchEndX = e.changedTouches[0].screenX;
                const touchEndY = e.changedTouches[0].screenY;
                const deltaX = touchEndX - touchStartX;
                const deltaY = touchEndY - touchStartY;

                if (Math.abs(deltaX) > 50 && Math.abs(deltaX) > Math.abs(deltaY) * 1.5) {
                    if (deltaX < 0) {
                        document.getElementById('nextMonth').click();
                    } else {
                        document.getElementById('prevMonth').click();
                    }
                }
            }, { passive: true });

            // ===== ЗАПУСК =====
            initTheme();
            render();
        })();
    </script>
